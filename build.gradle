plugins {
    id 'com.android.application' version '8.1.1'
}

android {
    namespace 'com.example.gbaemulator'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.gbaemulator"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"

        externalNativeBuild {
            cmake {
                cppFlags ""
            }
        }
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
 
